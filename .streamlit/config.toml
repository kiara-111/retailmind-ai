# Light and dark appearance follow the reader's system setting (no forced base).
# Contrast (WCAG): text 16.7:1 light / 15.5:1 dark; primary button label 6.1:1 light / 4.6:1 dark.
[theme]
font = "system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
showSidebarBorder = false

[theme.light]
primaryColor = "#1F6F4A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F2"
textColor = "#1B1F1C"
linkColor = "#1F6F4A"
chartCategoricalColors = ["#1F6F4A"]

[theme.dark]
primaryColor = "#23855A"
backgroundColor = "#121413"
secondaryBackgroundColor = "#1C201E"
textColor = "#E8ECE9"
linkColor = "#5BC08C"
chartCategoricalColors = ["#5BC08C"]

[browser]
gatherUsageStats = false
