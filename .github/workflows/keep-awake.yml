name: Keep app awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (GitHub may run this late; cron-job.org can also start it)
  workflow_dispatch:

jobs:
  visit-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
        env:
          APP_URL: ${{ vars.APP_URL }}
